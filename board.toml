# Xiaomi MIX Flip (ruyi) board description for the UniXNU format-2 build driver.
#
# Target: iOS 16.7.16 (20H392) userland of the iPhone X (iPhone10,3 / d22ap),
# Darwin 22 kernel, on SM8650. Boot chain: stock ABL -> fastboot boot of a
# Mu-Silicium-derived UEFI (ruyiPkg) -> DarwinBoot -> XNU.
#
# SCOPE OF THIS PROFILE
#   This board file selects the *software-render* build: CoreAnimation composites
#   on the CPU, frames are copied into the ABL scanout buffer, and no GPU driver
#   is built or loaded. It is a configuration choice, not commented-out GPU code:
#   `[components] include` simply does not name any GPU component, and
#   `configs/ruyi_defconfig` has no GPU switch. Selecting a GPU profile later
#   means adding the components here, not uncommenting code.
#
#   Display scope is the internal folding panel only: 1224 x 2912 native pixels,
#   stride 4896, 32-bit. The cover display (1208 x 1392) has no node, no
#   property and no component in this repository.
#
# EVERY HARDWARE VALUE BELOW HAS A SOURCE. The authoritative record with
# per-value provenance is porting.toml; notes/EVIDENCE.md holds the raw reads.
# Where a value is not yet measured on ruyi it is marked REQUIRED_ and the build
# refuses it, rather than inheriting a value from a same-SoC phone.

schema_version = 2

[board]
name = "ruyi"
soc = "SM8650"
soc_source = "sm8650"
os_profile = "ios-16.7.16-20H392"
description = "Xiaomi MIX Flip (SM8650), internal display only, software rendering"
kit = "ruyi"

# userdata geometry is needed only for the UFS-root route, which this profile
# does not use (the root filesystem is a RAM disk). It stays empty on purpose:
# writing a guessed LBA range here would be an unverified hardware constant.
# Fill it from the ruyi GPT when the UFS root path is ported.
# [userdata]
# first_lba = REQUIRED_
# last_lba  = REQUIRED_
# lba_bytes = 4096

[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d22ap"
chip_id = 0x8015
board_id = 0x06
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

# Member pins computed from the local 20H392 archive and cross-checked against
# the pins published by lonzzi/UniXNU-houji (the working SM8650 iOS-16 port),
# which agree for all four members. See notes/ipsw/IPSW-FACTS.md.
[ipsw.sha256]
"kernelcache.release.iphone10b" = "2d6a13d040aaf87cec09bb6906d43e9bd8cea951e43d1aa1cd62707dfdc5aaec"
"DeviceTree.d22ap.im4p" = "480e8b0888949b4128b7aa2cd254497581c69e1bafa596a760b2fa955a8a6368"
"087-86698-044.dmg.trustcache" = "63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b"
"087-86593-047.dmg.trustcache" = "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361"
# The three disk images the userdata windows consume. Pinning them makes the
# fetch step refuse a different 20H392 archive or a truncated member.
"087-86698-044.dmg" = "80f426d5b8fca8552f95be427434f1911dbb4c2c6d28aad94f2426ddd0c92483"
"087-86593-047.dmg" = "9cd738f3b0169055549df84ad6d8d13e50a2da39af618ce0522ca4e06df86849"
"087-86715-047.dmg" = "391f2df322c3172b021b2874f6da5c3e78b70b3df8f502e1a4af2b1d715c4608"

[components]
# ArmDTPlatform builds the platform expert from the board DTS; ArmCpu drives the
# GICv3 and the generic timer; SoftwareAES supplies XNU's AES routines without
# the Apple crypto accelerator; XnuPrelink links against the original kernelcache.
#
# GopFramebuffer is the display component: it publishes the MobileFramebuffer
# (IOMobileFramebuffer) service and, with the CPU transfer path, copies the
# compositor's IOSurface rows into the GOP scanout. It has no GPU dependency.
#
# Deliberately absent: Adreno740, AdrenoMetal, AdrenoPM4, AdrenoFirmware,
# ArmSmmu4K, AirNir. Those are the SM8650 GPU stack. This profile reaches
# SpringBoard with CoreAnimation on the CPU, so they are not built at all.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "GopFramebuffer"]

[kernel]
defconfig = "ruyi_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8650.config", "os:configs/ipados.config"]
# Device series only. The shared arch/soc/os series in this UniXNU snapshot
# target xnu-10063.141.1 (the iPadOS 17 profile), while this port runs xnu-8796
# (Darwin 22). Referencing them makes `unixnu status` abort with "patch missing"
# or applies hunks against the wrong source. Both working SM8650 iOS-16 ports
# (kerrinz/UniXNU-zorn, Asultop/UniXNU-NX769J) use exactly this one-series form
# for the same reason. Revisit when a shared xnu-8796 series exists.
patch_series = ["device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-libpthread-kernel.py",
  "build-gop-legacy-display.py",
]

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# The decompressed arm64 slice of kernelcache.release.iphone10b from 20H392.
# Computed locally from the pinned IPSW member:
#   member sha256   2d6a13d0...  (matches the [ipsw.sha256] pin above)
#   arm64 slice     2ec297ba...  (50937856 bytes)
# This is the value the prelink step must reproduce; it is a property of the
# Apple kernelcache, not of ruyi hardware, so it is safe to pin exactly.
kernelcache_sha256 = "2ec297bac95bcba01046fd0148e97e7e5885c05a6c18827f39f534ba375c1221"
slide = "-0x1000000"
# No early_security_init line: AMFI's early initializer panics with
# "AMFI: No PMGR?" unless an ApplePMGRNub provider exists, and this profile
# builds no PMGR nub. Leaving the initializer out defers AMFI to normal kext
# loading, which is the same decision the verified ruyi bring-up used.
# The roots list is the iOS 16 / Darwin 22 prelink root set.
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[device_tree]
source = "device:dts/ruyi.dts"
# The SoC resources (GIC, timer, CPU topology, UFS) come from the board-local
# SM8650 slice in soc/sm8650/, selected by feeds.toml. The board DTS includes
# its dtsi and adds only board wiring and reservations.
include_dirs = ["soc:dts"]

[firmware]
# The UEFI platform package is a Mu-Silicium derivative with a ruyi board
# package (ruyiPkg) copied from the same-SoC giulia package and changed only in
# board identity, framebuffer PCDs and the Display_Reserved memory map entry.
#
# REQUIRED: point --uefi at a ruyi Mu-Silicium checkout. The paths below are
# the intended layout and are not yet exercised by a published ruyi UEFI
# repository; the firmware step fails loudly if the checkout is absent.
config = "ruyi"
dsc = "Platforms/Xiaomi/ruyiPkg/ruyi.dsc"
fd = "Build/ruyiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = []
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "ruyi"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "ruyi-research"

[payload]
volume = "RUYIESP"
# kernel.macho is ~17 MB and the ADT a few KiB; 64 MiB leaves room for a
# multi-part initrd list without inflating the boot image.
size_mib = 64
loader = "firmware"
title = "Boot"
# Must equal the size of the memory node in dts/ruyi.dts; the payload step
# refuses the tree otherwise. 0x240000000 = 9 GiB, the contiguous upper DDR
# run 0x8c0000000..0xb00000000 in the ruyi live FDT.
dram_size = "0x240000000"
# The panic screen patch carries offsets specific to one kernel layout. The
# ruyi kernel is not qualified against it yet, so it stays off.
panic_screen = false
timeout = 3
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  # All eight cores. cpus=N selects an initial prefix; 8 = every core the ADT
  # exports. Drop to 1 for the first bring-up boots if SMP is unstable.
  "cpus=8",
  # Keep the kernel console off the scanout once userland owns the display, so
  # the composited frame is not overdrawn by kernel text.
  "ruyifb_noconsole=1",
  # Presentation rate of the CPU copy, in Hz. 30 is the accepted range for
  # software rendering (20-30 fps); it is a policy value, not a panel timing.
  "ruyifb_hz=30",
  "keepsyms=1",
  "-noprogress",
  "wdt=-1",
  "unentitled_ios_sim_launch=1",
  "ignition_level=1",
  "launchd_unsecure_cache=1",
  "rootrw=1",
  "rd=md0",
]

[payload.adt]
# The chip ID seeds IOPlatformUUID together with --unique-chip-id. 0x8015 is the
# A11 / iPhone X SoC ID that the target userland expects, from the IPSW build
# identity (ApChipID 0x8015), not a ruyi hardware register.
chip_id = "0x8015"
# DarwinBoot's contiguous window request: 8 GiB, the maximum the loader accepts.
# The ruyi device has 12 GB of DRAM, so an 8 GiB window is safe and is what the
# verified bring-up used for a multi-part RAM-disk root.
owned_memory_size = "0x200000000"
# The platform seed is not stored in any repository: pass --unique-chip-id HEX
# (or UNIXNU_UNIQUE_CHIP_ID). Required, so a build without it fails rather than
# inventing an identity.
unique_chip_id = "required"

# The ABL splash buffer is already described by the board device tree as
# /reserved-memory/splash_region (label "cont_splash_region", reg
# 0xFC400000 + 45 MiB), so the bootloader keeps the panel powered across the
# handoff. What the firmware's SimpleFbDxe additionally needs is the *name*
# "Display Reserved": it calls LocateMemoryRegionByName("Display Reserved") and
# installs no GOP when the name is absent. The node below adds that alias to the
# boot image's copy of the firmware DTB only. Do not also add it to
# dts/ruyi.dts: the XNU hardware tree must not contain a duplicate node.
[[bootimg.dtb_node]]
path = "/reserved-memory/display_reserved"
props = [
  { name = "label", type = "s", value = "Display Reserved" },
  { name = "reg", type = "x", value = ["0x0", "0xFC400000", "0x0", "0x2B00000"] },
]
