name: Repository checks

# Host checks that need no device and no Apple input:
#   - the scope rules: no GPU driver, no cover display
#   - the hardware tree: board DTS compiles, ADT generates, and the values the
#     selected components read are present and consistent
#   - the porting record

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends device-tree-compiler python3

      - name: Fetch the UniXNU build driver
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: .unixnu

      - name: Scope rules (no GPU driver, no cover display)
        run: python3 scripts/check-scope.py

      - name: Hardware tree and ADT
        run: python3 scripts/check-tree.py --unixnu .unixnu --device .

      - name: Pin lengths (a truncated sha256 never matches)
        run: python3 scripts/check-pins.py

      - name: Effective kernel configuration
        run: python3 scripts/check-defconfig.py --unixnu .unixnu --device .

      - name: Porting record
        run: python3 .unixnu/scripts/porting-record.py check --device .

      - name: Firmware payload integration (needs a ruyi Mu-Silicium checkout)
        run: |
          # No ruyi Mu-Silicium repository is published yet, so this runs only when
          # the checkout is supplied. It is a wiring check, not a firmware build.
          if [ -d ../uefi-ruyi ]; then
            python3 scripts/check-firmware.py --uefi ../uefi-ruyi
          else
            echo "SKIP: no ruyi Mu-Silicium checkout at ../uefi-ruyi"
            echo "      the integration patch and checker are still recorded in firmware/"
          fi

      - name: The display builder must verify the ABI audit and then refuse
        run: |
          # It must fail (the object size and backend leaves are still missing)...
          if python3 scripts/build-gop-legacy-display.py 2>/dev/null; then
            echo "the display builder succeeded, but its remaining inputs are not implemented"
            exit 1
          fi
          # ...but only AFTER accepting the committed audit, not because it is absent.
          python3 scripts/build-gop-legacy-display.py 2>&1 | grep -q "ABI audit verified" \
            || { echo "the display builder rejected the committed ABI audit"; exit 1; }
          echo "display builder verified the audit and correctly refuses to emit an archive"
