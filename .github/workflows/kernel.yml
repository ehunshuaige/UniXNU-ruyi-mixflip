name: Kernel build (hosted macOS)

# Builds the XNU kernel for the ruyi software-render profile on a GitHub-hosted
# macOS runner and runs the Android-side profile end to end: defconfig
# resolution, the XNU compile, and the prelink against the pinned 20H392
# kernelcache.
#
# Why this workflow lives here and not in the UniXNU fork: GitHub does not run
# workflows on a fork of a public repository until the owner enables them in the
# Actions tab, and the REST API cannot grant that. A workflow in this repository
# can still check out the fork, so the build runs here and the source stays
# where it is.
#
# Only text logs are uploaded. The kernel, payload and kernelcache derive from
# Apple software and are not published - not even as artifacts. The logs are
# enough to answer the question this workflow exists to answer: does the kernel
# build and prelink for this profile at all.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: What to build
        type: choice
        options:
          - kernel
          - kernel payload
        default: kernel
      xcode:
        description: Xcode version of the macos-26 image (/Applications/Xcode_<version>.app)
        required: true
        default: "26.6"
      unixnu_ref:
        description: UniXNU fork ref carrying the ios-16.7.16-20H392 OS profile
        required: true
        default: "ruyi-format2"
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      jobs:
        description: Parallel make jobs. Set to 1 for a serial build whose log is not interleaved (much slower, but the only way to read a failure inside a parallel component).
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}-${{ inputs.steps }}-${{ inputs.unixnu_ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      UNIXNU_IPSW: ${{ inputs.ipsw_url }}
      DEFCONFIG: ruyi_defconfig
      STEPS: ${{ inputs.steps }}
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - name: Check out UniXNU (fork, branch with the iOS 16 OS profile)
        uses: actions/checkout@v4
        with:
          repository: ehunshuaige/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: unixnu
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the inputs
        id: check
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "the device repository has no board.toml"
          [ -f "device/configs/$DEFCONFIG" ] || fail "device/configs/$DEFCONFIG not found"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR; installed: $(printf '%s ' /Applications/Xcode_*.app)"
          [ -f unixnu/profiles/os/ios-16.7.16-20H392/profile.toml ] \
            || fail "the UniXNU ref has no ios-16.7.16-20H392 OS profile; check unixnu_ref"
          echo "device repo:  $(git -C device rev-parse --short HEAD)"
          echo "unixnu ref:   $(git -C unixnu rev-parse --short HEAD)"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version 2>/dev/null | head -n 1 || true
          xcrun --sdk iphoneos --show-sdk-version || true
          python3 --version
          missing=0
          for tool in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc; do
            path=$(command -v "$tool" || true)
            printf '%-10s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || missing=1
          done
          exit "$missing"

      - name: Select the chip id seed
        id: seed
        run: |
          # The board requires a platform seed for the payload. This is a synthetic
          # value ('RUYI' + 1), not a device ECID: it only seeds IOPlatformUUID.
          echo "value=0x5357454554000001" >> "$GITHUB_OUTPUT"

      - name: Note the xnu-8796 build patches
        run: |
          # Two compatibility hunks live in device/patches/xnu/series because the
          # shared arch/soc/os series targets xnu-10063:
          #
          #   local-availability.patch  make_symbol_aliasing.sh honours
          #     XNU_AVAILABILITY_PL, which the build driver already exports. The
          #     xnu-10063 generator does this itself; xnu-8796 does not, and the
          #     installhdrs pass dies without it.
          #   drop-trivial-auto-var-init-acknowledgement.patch  current clang
          #     rejects Apple's acknowledgement flag for the experimental
          #     -ftrivial-auto-var-init feature as an unknown argument.
          #   backport-iorpc-kernel-content.patch  the SDK's iig emits IORPC
          #     initialisers setting kernelContent, which xnu-8796's IORPC
          #     lacks; XNU does not publish iig's source, so the field that
          #     newer XNU has is backported instead.
          #
          # No SDK mutation is needed: the driver installs availability.pl into
          # its own fakeroot and the patch redirects the generator there.
          grep -c '^[a-z].*\.patch$' device/patches/xnu/series | xargs echo "device xnu patches:"
          # Record which generator the SDK supplies, so a future skew is
          # recognisable from the log alone.
          IIG="$(xcrun --sdk iphoneos -find iig)"
          echo "iig: $IIG"
          "$IIG" --help 2>&1 | head -30 || true

      - name: Select the device
        working-directory: unixnu
        run: |
          ./unixnu defconfig "$DEFCONFIG"
          ./unixnu status --json > "$RUNNER_TEMP/status.json" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/status.json" <<'PY' || true
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit(0)
          try:
              data = json.loads(path.read_text() or '{}')
          except ValueError:
              raise SystemExit(0)
          def text(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  return value.get('name') or value.get('id') or ''
              return ''
          print('resolved device :', text(data.get('device')) or data.get('device'))
          groups = data.get('components')
          if isinstance(groups, list):
              names = [text(item) for item in groups]
              print('components      :', ', '.join(n for n in names if n))
          print('out             :', text(data.get('out')))
          PY

      - name: Install a Kernel Development Kit
        run: |
          set -euo pipefail
          # osfmk/arm/pmap/pmap.c includes <arm64/ppl/sart.h> and <arm64/ppl/uat.h>
          # unconditionally. That is Apple's protected page layer, which
          # apple-oss-distributions/xnu never publishes and which neither the
          # Xcode iPhoneOS SDK nor this runner image carries. It ships in a
          # Kernel Development Kit.
          #
          # `ipsw download kdk` reads Apple's public software catalog, so no
          # Apple ID is involved, and --install puts the KDK under
          # /Library/Developer/KDKs.
          if [ -z "$(ls -A /Library/Developer/KDKs 2>/dev/null || true)" ]; then
            brew install blacktop/tap/ipsw
            sudo ipsw download kdk --host --install
          fi
          echo "--- installed KDKs"
          ls -la /Library/Developer/KDKs || true
          echo "--- ppl headers found"
          find /Library/Developer/KDKs -path '*arm64/ppl*' -name '*.h' 2>/dev/null | head -10
          echo "--- firehose / os headers found"
          find /Library/Developer/KDKs -name 'firehose_buffer_private.h' 2>/dev/null | head -3
          # Fail here rather than 600 lines into a compile: without the PPL
          # headers no arm64 kernel links, and that is the whole point of the
          # KDK.
          if ! find /Library/Developer/KDKs -name 'sart.h' -path '*arm64/ppl*' 2>/dev/null | grep -q .; then
            echo "::error::the KDK does not carry arm64/ppl/sart.h"
            exit 1
          fi

      - name: Provide the kernel SDK os/ headers to the macOS SDK
        run: |
          set -euo pipefail
          # xnu compiles with -I$(SDKROOT)/usr/local/include/kernel
          # (makedefs/MakeInc.def: INCFLAGS_SDK). On Linux the build driver
          # answers every xcrun --sdk query with its own fakeroot, so that path
          # lands inside the fakeroot; on macOS SDKROOT resolves to the real
          # SDK, which has no usr/local/include/kernel at all. The fakeroot copy
          # is made and is correct - the diagnostic step shows
          # <os/firehose_buffer_private.h> sitting in it - it is simply never
          # searched.
          #
          # The runner is disposable, so mirror what a Kernel Development Kit
          # provides: build the same os/ header set the driver builds, and put it
          # where the compiler looks.
          cd unixnu
          ./unixnu fetch
          dispatch=$(ls -d out/feeds/libdispatch-* 2>/dev/null | head -1)
          platform=$(ls -d out/feeds/libplatform-* 2>/dev/null | head -1)
          [ -n "$dispatch" ] || { echo "::error::libdispatch feed missing"; exit 1; }
          [ -n "$platform" ] || { echo "::error::libplatform feed missing"; exit 1; }
          stage="$RUNNER_TEMP/os-stage"
          rm -rf "$stage"; mkdir -p "$stage"
          # libplatform contributes most of the set (atomic/lock/log internals).
          for tree in "$platform/include" "$platform/private"; do
            [ -d "$tree/os" ] && cp -R "$tree/os/." "$stage/"
          done
          # libdispatch contributes the SPI headers, unifdef'd for the kernel
          # exactly as build-xnu-4k-baseline.sh does.
          count=0
          for header in "$dispatch"/os/*.h; do
            name=$(basename "$header")
            if unifdef -DKERNEL=1 -DOS_FIREHOSE_SPI=1 \
                 -DOS_VOUCHER_ACTIVITY_SPI_TYPES=1 -UOS_VOUCHER_ACTIVITY_SPI \
                 "$header" > "$stage/$name"; then
              :
            else
              rc=$?
              [ "$rc" -eq 1 ] || { echo "skip $name (unifdef rc=$rc)"; continue; }
            fi
            count=$((count + 1))
          done
          echo "staged $(ls "$stage" | wc -l) os/ headers ($count from libdispatch)"
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          # Both layouts a kernel SDK uses are cheap to satisfy, and the exact
          # one xnu resolves is not worth guessing.
          for dest in "$sdk/usr/local/include/kernel/os" "$sdk/usr/local/include/os"; do
            sudo mkdir -p "$dest"
            sudo cp -R "$stage/." "$dest/"
            echo "installed into $dest"
          done
          ls "$sdk/usr/local/include/kernel/os" | head -8

          # The same gap breaks the link step: the driver builds
          # libfirehose_kernel.a into .cache/fakeroot/usr/local/lib/kernel
          # (scripts/build-firehose.sh), and the linker searches
          # -L$(SDKROOT)/usr/local/lib/kernel. Point the SDK path at the
          # fakeroot directory the build will fill. It does not exist yet, so the
          # link is created dangling on purpose and becomes live when
          # build-firehose.sh installs the archive.
          work=$(./unixnu status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["output"])')
          echo "work: $work"
          sudo mkdir -p "$sdk/usr/local/lib"
          sudo ln -sfn "$work/tree/.cache/fakeroot/usr/local/lib/kernel" "$sdk/usr/local/lib/kernel"
          ls -l "$sdk/usr/local/lib/kernel"

      - name: Build kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOBS: ${{ inputs.jobs }}
        run: ./unixnu build kernel

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        working-directory: unixnu
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ steps.seed.outputs.value }}
        run: ./unixnu build payload

      - name: Show the result
        if: always()
        run: |
          echo "## ruyi kernel build"
          set +e
          find unixnu/out -maxdepth 4 -type d 2>/dev/null | head -30
          echo
          python3 - <<'PY' || true
          import hashlib
          from pathlib import Path
          root = Path('unixnu/out')
          for name in ('kernel.macho', 'kernel.macho.adt'):
              for path in sorted(root.rglob(name)) if root.is_dir() else []:
                  print(name, path.stat().st_size, 'bytes',
                        hashlib.sha256(path.read_bytes()).hexdigest(), path)
          PY

      - name: Diagnose the kernel SDK header tree
        if: always()
        run: |
          set +e
          echo "## kernel SDK fakeroot"
          tree_dir=$(find unixnu/out -maxdepth 5 -type d -name tree | head -1)
          echo "tree: $tree_dir"
          if [ -n "$tree_dir" ]; then
            echo "--- refer/"
            ls -la "$tree_dir/refer" 2>/dev/null | head -20
            echo "--- refer/libdispatch (first entries)"
            ls "$tree_dir/refer/libdispatch" 2>/dev/null | head -8
            echo "--- refer/libdispatch/os"
            ls "$tree_dir/refer/libdispatch/os" 2>/dev/null | head -25
            echo "--- fakeroot/usr/local/include/os"
            ls "$tree_dir/.cache/fakeroot/usr/local/include/os" 2>/dev/null | head -25
            echo "--- count"
            ls "$tree_dir/.cache/fakeroot/usr/local/include/os" 2>/dev/null | wc -l
            echo "--- where firehose lives anywhere in the build"
            find unixnu/out -name 'firehose_buffer_private.h' 2>/dev/null | head -5
          fi
          echo "--- feeds"
          ls -d unixnu/out/feeds/* 2>/dev/null | head -20
          echo "--- unifdef"
          command -v unifdef || echo "unifdef MISSING"

      - name: Collect the text logs
        id: logs
        if: always()
        run: |
          # Text logs only. The kernel, payload, kernelcache and IPSW members
          # derive from Apple software and are never uploaded, not even as
          # artifacts.
          python3 - <<'PY'
          import os, re, shutil
          from pathlib import Path
          source = Path('unixnu/out')
          target = Path(os.environ['RUNNER_TEMP']) / 'logs'
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir(parents=True, exist_ok=True)
          count = 0
          for path in sorted(source.rglob('*.log')) if source.is_dir() else []:
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              text = data.decode('utf-8', 'replace')
              text = re.sub(r'https?://[^\s"\']*[?&](?:token|sig|signature|key|X-Amz-Signature)=[^\s"\']*',
                            '***', text, flags=re.I)
              name = '__'.join(path.relative_to(source).parts)
              (target / name).write_text(text)
              count += 1
          print(f'{count} text logs staged')
          PY

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruyi-kernel-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logs/*.log
          if-no-files-found: warn
          retention-days: 14
