  "Prelink roots: 31 kext bundle identifiers, each checked to exist in the __PRELINK_INFO of this exact 20H392 kernelcache.",
  "Payload: kernel.macho plus kernel.macho.adt in a 64 MiB FAT volume, booted by DarwinBoot from the firmware.",
]
configuration = [
  "[ipsw] product iPhone10,3, version 16.7.16, build 20H392, device_class d22ap, chip_id 0x8015, board_id 0x06.",
  "[ipsw.sha256] pins kernelcache.release.iphone10b, DeviceTree.d22ap.im4p and the two trust caches.",
  "[kernel.prelink] kernelcache_sha256 = 2ec297bac95bcba01046fd0148e97e7e5885c05a6c18827f39f534ba375c1221, slide = -0x1000000, no early_security_init.",
  "[payload] volume RUYIESP, 64 MiB, dram_size 0x240000000, panic_screen false.",
  "kernel_args: -v serial=3 debug=0x14e cpus=8 ruyifb_noconsole=1 ruyifb_hz=30 keepsyms=1 -noprogress wdt=-1 unentitled_ios_sim_launch=1 ignition_level=1 launchd_unsecure_cache=1 rootrw=1 rd=md0.",
]
procedure = [
  "Fetch the IPSW members and check every member against its pin.",
  "Build the kernel, prelink it against the pinned kernelcache, generate the ADT, and assemble the payload and boot image.",
  "Inspect the boot image report: kernel and ADT hashes, the dram size, and the presence of the display_reserved alias in the firmware DTB.",
]
findings = [
  "The 20H392 kernelcache decompresses to a fat Mach-O; only the arm64 slice is pinned, because the prelink compares the slice the kernel is built against, not the compressed container.",
  "Every prelink root must exist in the target kernelcache or the prelink aborts on a missing dependency. The list was therefore checked identifier by identifier against this build's __PRELINK_INFO rather than inherited from another iOS version.",
  "The iPadOS 17.7.11 profile's kernelcache sha256 (f18b4df8...) is a different Apple build and cannot be reused; using it would fail the prelink pin, which is the intended guard.",
]
