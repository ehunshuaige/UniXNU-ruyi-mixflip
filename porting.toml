paths = ["dts/ruyi.dts", "board.toml", "configs/ruyi_defconfig", "docs/evidence/**", "drivers/RuyiDisplay/**", "scripts/build-gop-legacy-display.py"]
inputs = [
  "Internal (folding) panel: 1224 x 2912 native pixels, 32-bit, stride 4896 bytes (1224 * 4). Panel node qcom,mdss_dsi_n8_42_02_0a_prim_dsc_cmd, DSI command mode with DSC, 22 timing entries, from the ruyi live FDT.",
  "Scanout memory: the ABL splash reservation at 0xFC400000, 45 MiB, from the ruyi live FDT /reserved-memory/splash_region.",
  "Framebuffer geometry at handoff: DarwinBoot reads it from GOP; the display component requires 32-bit depth, no rotation and stride >= width*4.",
]
configuration = [
  "dts/ruyi.dts /reserved-memory/splash_region carries label cont_splash_region and reg = <0x0 0xfc400000 0x0 0x2b00000>.",
  "configs/ruyi_defconfig: CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y, CONFIG_XNU_NATIVE_MOBILE_DISPLAY=n.",
  "Kernel arguments ruyifb_noconsole=1 (stop kernel text overdrawing the composited frame) and ruyifb_hz=30 (CPU presentation rate).",
  "Component GopFramebuffer: publishes the MobileFramebuffer (IOMobileFramebuffer) service and copies composited IOSurface rows into the GOP scanout on the CPU.",
]
procedure = [
  "Compile the board DTS and confirm the splash reservation is present with the cont_splash_region label.",
  "Build the kernel with the GopFramebuffer component and the legacy display archive, boot the payload, and read the display checkpoints from the kernel console.",
  "Confirm on the internal panel that the composited frame appears, and record the presentation rate separately from the panel's own refresh rate.",
]
findings = [
  "The display path here is CPU copy, not GPU presentation: the driver validates a compositor IOSurface and copies its rows into the scanout buffer. No Adreno command stream, no GPU firmware and no GPU driver is involved, which is what makes a SpringBoard frame possible with no GPU driver at all.",
  "The panel is 1224 x 2912 in its own scan orientation, i.e. 2912 x 1224 as the user sees it folded open; stride is 1224*4 = 4896 bytes. A GOP-reported stride is not a substitute: the value must be the one the panel and the scanout buffer actually use.",
  "The iOS 16.7.16 IOMobileGraphicsFamily is NOT the binary the earlier ruyi display bring-up audited. That bring-up device-verified a driver whose ABI facts were read from the iPadOS 17.7.11 kernelcache (executable sha256 2e044ee6...). The 20H392 kernelcache carries a different IOMobileGraphicsFamily (343.0.0, executable sha256 03e4c4d8...), so the vtable offsets, the nine abstract leaves and the object size in that audit do not apply and must not be reused. Re-running scripts/audit-mobile-graphics-legacy.py against a 20H392 prelink candidate is a prerequisite for building the display driver here.",
  "No GPU driver is selected, so the render server must fall back to CPU compositing. Whether iOS 16's backboardd takes that fallback without a Metal device is the open question this profile exists to answer; it is not established by this record.",
  "The iOS 16 display ABI has now been audited from the pinned kernelcache itself: IOMobileGraphicsFamily 343.0.0, __TEXT_EXEC sha256 03e4c4d8..., Legacy vtable 0xfffffff006def8e0 with 338 virtual entries and nine abstract slots [211, 212, 242, 243, 292, 293, 321, 322, 329], C2 constructor 0xfffffff005c0bbc8, instance size 0x1660, and newUserClient overridden at slot 141. The full method table is committed at drivers/RuyiDisplay/mobile-graphics-legacy-abi.json.",
  "The instance size was derived statically, not from a live run: the derived-meta-class constructor at 0xfffffff005c0bc94 materialises the class-name string, the superclass meta class and MOVZ w3,#0x1660 before calling OSMetaClass::OSMetaClass, whose third argument is the size alloc() uses. The iPadOS 17 binary's size is 0x18a0.",
  "That audit also proves the iPadOS 17 facts were unusable: that binary has 358 entries and abstract slots [211, 213, 245, 246, 306, 307, 337, 338, 345]. Building from the old values would have dispatched through the wrong entries rather than failing to link.",
]
completion = [
  "The display publishes IOMobileFramebuffer on the internal panel and a composited frame reaches the 2912 x 1224 scanout.",
  "The frame is produced by CPU compositing with no GPU driver loaded.",
]
limits = [
  "Nothing in this area is device-verified from this repository.",
  "The display archive still cannot be built: the nine backend leaf implementations for the abstract slots and the original-bindings assembly are not written yet. All the address and layout facts they need are now in drivers/RuyiDisplay/mobile-graphics-legacy-abi.json, so no live run is required to obtain them. scripts/build-gop-legacy-display.py validates the committed audit against the pinned kernelcache and then stops with that list.",
  "Backlight, display power and the panel's DSI bring-up are not implemented. The firmware leaves the panel scanning out; this profile only copies frames into the buffer it hands over.",
  "The presentation rate (ruyifb_hz=30) is a policy value and says nothing about the panel's real refresh rate or about sustained frame rate.",
]
next_action = [
  "Implement the nine backend leaves and the original-bindings assembly using drivers/RuyiDisplay/mobile-graphics-legacy-abi.json as the sole address source.",
]
evidence = [
  { kind = "source", reference = "docs/evidence/RUYI-FDT-FACTS.md", result = "Internal panel node with 0x4c8 x 0xb60 (1224 x 2912) over 22 timing entries, and the 0xfc400000 + 0x2b00000 scanout reservation, both from the live ruyi FDT." },
  { kind = "source", reference = "board.toml", result = "GopFramebuffer is the only display component; no GPU component is selected." },
  { kind = "source", reference = "docs/evidence/DISPLAY-FIELD-OFFSETS-20H392.md", result = "Preliminary private field layout for the iOS 16 object: 0x1458 and 0x145c are two adjacent uint32 fields with dedicated getters and a joint copy-out routine, which is the shape of the framebuffer width and height; the pending swap queue is not located yet. The iPadOS offsets cannot be reused: the object is 0x1660 here against 0x18a0 there." },
  { kind = "host", reference = "drivers/RuyiDisplay/mobile-graphics-legacy-abi.json", command = "python3 scripts/build-gop-legacy-display.py --kernelcache <20H392 arm64 slice>", revision = "04b4e558bcded5213c2d802984862dc062f28257", result = "The committed iOS 16 display ABI audit verifies against the pinned kernelcache: Legacy vtable 338 entries, nine abstract slots, C2 constructor located; the builder then stops with the two remaining inputs." },
]

