schema_version = 1

[device]
name = "ruyi"
soc = "SM8650"
os_profile = "ios-16.7.16-20H392"
summary = "Xiaomi MIX Flip (ruyi, SM8650) running the iOS 16.7.16 userland of the iPhone X. This record covers the software-render profile: CoreAnimation composites on the CPU, frames are copied into the ABL scanout buffer, and no GPU driver is built or loaded. Only the internal 1224x2912 panel is described."

# How to read the completion levels in this record.
#
#   planned          inputs identified, no implementation in this repository yet
#   implemented      source exists here and is referenced; not run anywhere
#   host-verified    a command on a development host produced the stated result
#   device-verified  the stated result was observed on a ruyi device
#
# Nothing in this repository is `device-verified`. The port has not been booted
# from this repository: the display driver it selects was device-verified by an
# earlier bring-up against a *different* kernelcache (iPadOS 17.7.11), and the
# iOS 16 ABI audit that would carry that result over has not been done. See the
# display area. Claims are kept separate from intentions throughout.

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "soc/**", "patches/**", ".github/**", ".gitignore", "AGENTS.md", "README.md"]
inputs = [
  "SM8650 SoC profile: the board-local slice in soc/sm8650/ (selected by feeds.toml local source), holding the GICv3, generic timer, CPU topology and UFS resources. No shared SM8650 repository exists.",
  "iOS 16.7.16 build 20H392, iPhone10,3 / d22ap, chip ID 0x8015, board ID 0x06 - all from BuildManifest.plist of the pinned IPSW.",
  "Device defconfig configs/ruyi_defconfig and the software-render component set.",
]
configuration = [
  "schema_version = 2; board.soc_source = sm8650; board.os_profile = ios-16.7.16-20H392.",
  "[components] include = ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink, GopFramebuffer. No GPU component is selected; software rendering is this component set, not a disabled switch.",
  "config_fragments = arch:configs/common.config, os:configs/ipados.config; patch_series = arch, os, device.",
  "board.kit = ruyi; kernel.defconfig = ruyi_defconfig.",
]
procedure = [
  "Run ./unixnu defconfig ruyi_defconfig -D ../UniXNU-ruyi from a UniXNU checkout.",
  "Run ./unixnu status --json -D ../UniXNU-ruyi and review the resolved profiles, component order and patch order.",
  "Run python3 scripts/porting-record.py check --device ../UniXNU-ruyi.",
]
findings = [
  "Format 2 merges tables in arch, SoC, OS, device order and replaces ordinary arrays. There is no UniXNU-sm8650-common repository, so board.soc_source names a board-local slice (feeds.toml kind = soc, local = soc/sm8650), the same arrangement kerrinz/UniXNU-zorn uses. The slice holds SoC resources; board wiring, reservations and the panel stay in dts/ruyi.dts.",
  "The iOS 16 OS profile needed its own kernel config fragment: [kernel] config_fragments referenced os:configs/ipados.config, which exists only in the iPadOS profile. A missing fragment aborts defconfig assembly, and scripts/check-defconfig.py caught it. The profile now carries configs/ios.config.",
  "kernel.patch_series selects only device:patches/xnu/series. The shared arch/soc/os series in this snapshot are written against xnu-10063.141.1 while this port runs xnu-8796, so referencing them would apply hunks to the wrong source; both working SM8650 iOS-16 ports use the single-series form.",
  "The KDK is installed outside the SDK, and XNU only adds -I$(SDKROOT)/usr/local/include/kernel, so the workflow merges the KDK's kernel include tree into the SDK the build uses - both the usr/local/include/kernel layout and the Kernel.framework PrivateHeaders layout, since which one a KDK ships is not something to guess. It then asserts arm64/ppl/sart.h is readable before the build starts.",
  "The macOS runner is not reliable enough to assume a fixed setup cost: 'Install host tools' has taken six minutes and has also been abandoned after forty, with the job still inside brew. Kernel-only runs now install just llvm and dtc; lld and mtools are added only when the payload step is requested.",
  "The ipsw binary itself has to come from the project's release tarball, not Homebrew: there is no bottle for this macOS image, so `brew install blacktop/tap/ipsw` starts a full Go build and the step passed fifteen minutes before it was cancelled. The 27 MiB release archive needs no build.",
  "macOS has no `timeout` command, so the KDK step cannot bound its commands that way; it did fail with 'timeout: command not found' (exit 127) before doing anything. The step instead relies on --clean and </dev/null to stay non-interactive, which is what the fourteen-minute stall was about.",
  "Fetching that KDK needs bounded commands: the first form of the step sat for fourteen minutes and was cancelled, most plausibly on an interactive prompt that ipsw offers after --install. The step now passes --clean, redirects every command from /dev/null and wraps the install and the download in timeouts, so the failure mode is a timeout with a readable log instead of a stalled job.",
  "The fix is a Kernel Development Kit, and it does not need an Apple ID: `ipsw download kdk --host --install` reads Apple's public software catalog. The workflow installs it before the build and fails immediately if the installed KDK does not carry arm64/ppl/sart.h, so a missing KDK surfaces as that one line instead of a compile failure deep inside the kernel.",
  "The kernel now compiles completely, and the remaining blocker is structural, not a build error: osfmk/arm/pmap/pmap.c unconditionally includes <arm64/ppl/sart.h> and <arm64/ppl/uat.h> and calls sart_bootstrap() and uat_bootstrap(). Those headers and functions are Apple's protected-page-layer code, which apple-oss-distributions/xnu never publishes: neither 8796 nor 10063 has an osfmk/arm64/ppl directory, they are not in the Xcode SDK (which has no usr/local/include/kernel at all), and the GitHub macOS runner image ships no Kernel Development Kit. The pmap is the only implementation the tree offers - osfmk/conf/files.arm64 gates all six pmap sources behind nos_arm_pmap - so the kernel cannot link without that code.",
  "A parallel XNU build writes every job to one log, so a failure inside a component is interleaved beyond reading - the bootstrap log reached 2.8M lines and the failing line could not be recovered. The kernel workflow takes a jobs input; jobs=1 gives a serial build whose log can be read, at the cost of roughly four times the wall clock.",
  "The link step hits the same macOS gap: the driver builds libfirehose_kernel.a into .cache/fakeroot/usr/local/lib/kernel via scripts/build-firehose.sh, while the linker searches -L$(SDKROOT)/usr/local/lib/kernel. The workflow points the SDK path at the fakeroot directory, as a symlink created before it exists so it becomes live when the archive is installed.",
  "The macOS build has a structural problem the Linux path does not: xnu compiles with -I$(SDKROOT)/usr/local/include/kernel, and on Linux the build driver answers every xcrun --sdk query with its own fakeroot, where it has unifdef'd libdispatch's os/ headers. On macOS SDKROOT resolves to the real SDK, which has no usr/local/include/kernel, so those headers are not on the search path. The workflow now installs them into the SDK the way a Kernel Development Kit carries them. The same gap also makes several build-driver flags inert: CFLAGS_EXTRA, which the driver uses for -DXNU_NATIVE_PAN and the corecrypto selection, does not exist anywhere in xnu-8796.",
  "The kernel build now compiles the whole tree (2.18M log lines) and fails only where the kernel SDK header tree is incomplete: libkern/os/log.c, bsd/kern/log.c and bsd/kern/subr_log.c include <os/firehose_buffer_private.h>, which the build driver copies into its fakeroot from refer/libdispatch/os. The workflow prints the fakeroot and refer state on failure so the missing link is visible from the log rather than inferred.",
  "The device patch series carries seven compatibility fixes for building xnu-8796 with a current Xcode clang: local-availability.patch (the same hunk upstream carries, making make_symbol_aliasing.sh honour the XNU_AVAILABILITY_PL the build driver already exports) and drop-trivial-auto-var-init-acknowledgement.patch (Apple's acknowledgement flag for the experimental -ftrivial-auto-var-init feature, which current clang rejects as an unknown argument and which fails every C and C++ compile). The third, backport-iorpc-kernel-content.patch, adds the kernelContent field that current SDK iig output sets: the generator lives in the SDK, XNU does not publish its source, so a matching generator cannot be built and the field newer XNU has is backported instead, under the same #ifdef KERNEL guard and with the same type. The fourth, align-uio-stackbuf-declarations.patch, rewrites the 36 stack buffers that uio_createwithbuffer fills: they were declared as uio_stackbuf_t arrays, an aligned char element type, and a char array element whose size is not a multiple of its alignment is now a hard error in clang. The declarations name the alignment with _Alignas instead, which keeps each buffer exactly UIO_SIZEOF(n) bytes; widening the element would have multiplied every such buffer on the stack by the alignment. The fifth, rename-pmap-non-pac-padding.patch, renames a padding field in pmap.h that is declared twice when a platform has neither Rosetta nor Apple PAC; Apple's own arm64 platforms always have PAC, which is why upstream never saw it, and newer XNU renumbers the second one. The sixth, enable-nos-arm-asm.patch, is the one that matters for linking: doconf builds the kernel configuration from the '#  NAME = [ ... ]' lines in config/MASTER.<cpu>, extracting them with sed, so the leading '#' is the file convention rather than a comment. bcm2837 lists neither nos_arm_asm nor nos_arm_pmap, and osfmk/conf/files.arm64 gates locore.s, start.s, caches_asm.s and the amcc sources behind them; without the flags the whole arm64 boot, cache and copyio layer is excluded and 265 symbols come up undefined at link. The shared UniXNU machine-layer patch enables the same two flags. Enabling those flags exposed the second half of the same problem: config/files.arm64 then asks for osfmk/arm64/amcc_rorgn_ppl.c and amcc_rorgn_common.c, Apple's memory cache controller sources, and xnu-8796 ships only amcc_rorgn.h - both .c files are gone from this version - so the build fails on sources it cannot find. gate-apple-amcc.patch puts an apple_amcc option in front of them that no config enables, which is what the shared machine-layer patch does. All seven apply cleanly in order to xnu-8796's own sources; only the sixth changes what is compiled.",
  "Building the iOS 16 image hits a real tooling incompatibility: xnu-8796 generates bsd/sys/_symbol_aliasing.h with bsd/sys/make_symbol_aliasing.sh, which requires ${SDKROOT}/${DRIVERKITROOT}/usr/local/libexec/availability.pl and fails the whole installhdrs pass without it. The xnu-10063 tree the build driver targets instead honours an XNU_AVAILABILITY_PL environment variable, so the driver only installs that file into its own fakeroot. Both SDKs are involved: installhdrs runs with SDKROOT=macosx and the kernel build with SDKROOT=iphoneos, and the bootstrap pass failed first for one and then for the other. The fix is the device patch local-availability.patch, which makes the generator honour XNU_AVAILABILITY_PL; an earlier CI step that copied the file into both SDKs with sudo was a workaround and is gone.",
  "The repository checks run on every push and on demand: scope rules, the hardware tree and ADT, pin lengths, the merged kernel configuration, the porting record, the display ABI audit, and the firmware payload wiring when a ruyi Mu-Silicium checkout is supplied. The kernel build is a separate workflow because it needs macOS.",
  ".github/workflows/kernel.yml builds the kernel on a hosted macOS runner from this repository: GitHub does not run workflows on a fork of a public repository until the owner enables them in the Actions tab, and the REST API cannot grant that, but a workflow here can still check out the fork. It uploads text logs only; the kernel and payload derive from Apple software and are not published as artifacts.",
  "The ruyi board was previously described in format 1 against the iPadOS 17.7.11 profile. That profile's kernelcache is a different Apple build from the iOS 16.7.16 one, so its prelink pins cannot be reused: every prelink input here is recomputed from the 20H392 IPSW.",
  "The iOS 16.7.16 kernelcache's IOMobileGraphicsFamily is a different binary from the iPadOS 17 one (executable sha256 03e4c4d8... vs 2e044ee6...), so display ABI facts do not carry over. See the display area.",
]
completion = [
  "All source pins resolve; every selected component has an owning area; status shows the intended component and patch order.",
  "The porting record checker reports no identity, coverage or evidence errors.",
]
limits = [
  "The SoC layer is a board-local slice (soc/sm8650/, feeds.toml local source), not a shared repository: no UniXNU-sm8650-common exists in the UniXNU organisation. kerrinz/UniXNU-zorn uses the same arrangement for this SoC. This is a deliberate temporary state, not the target architecture.",
  "Local build overrides can select different sources from the published pins; any verification must record the effective source.",
  "The shared arch/soc/os patch series in this UniXNU snapshot target xnu-10063.141.1 while this port runs xnu-8796, so board.toml selects only the device series. Patch applicability against xnu-8796 was not re-tested here (no macOS host or xnu-8796 checkout was available); the one-series form is what kerrinz/UniXNU-zorn and Asultop/UniXNU-NX769J use for the same reason.",
]
next_action = [
  "When a reviewed UniXNU-sm8650-common is published, replace the local slice with a pinned git source and reduce soc/sm8650/ to nothing.",
  "Re-test the shared patch series against an xnu-8796 checkout before referencing any of it.",
]
evidence = [
  { kind = "source", reference = "board.toml", result = "Format 2 board description; component selection, IPSW identity and payload inputs." },
  { kind = "source", reference = "configs/ruyi_defconfig", result = "Software-render kernel configuration; explicitly no GPU switch and no UFS driver." },
  { kind = "source", reference = "patches/xnu/series", result = "Two compatibility patches for building xnu-8796 with a current clang, both verified to apply cleanly to the pinned tag: local-availability.patch and drop-trivial-auto-var-init-acknowledgement.patch." },
  { kind = "source", reference = ".github/workflows/kernel.yml", result = "Hosted macOS kernel build for this device repository; checks out the UniXNU fork branch carrying the iOS 16 profile, and uploads logs only." },
  { kind = "host", reference = "scripts/check-defconfig.py", command = "python3 scripts/check-defconfig.py --unixnu <UniXNU> --device .", revision = "04b4e558bcded5213c2d802984862dc062f28257", result = "The merged arch/SoC/OS/device configuration enables the software display path, switches nothing forbidden on, and every enabled switch is read by a build script. Verified negative: adding CONFIG_XNU_NATIVE_ADRENO and an unknown switch makes it name both." },
  { kind = "host", reference = "https://unixnu.com/porting/device-repository", command = "python3 scripts/porting-record.py check --device ../UniXNU-ruyi", revision = "04b4e558bcded5213c2d802984862dc062f28257", result = "The record checker accepts this record: 13 structured areas, no identity or coverage errors." },
]

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/check-firmware.py", "firmware/**", "docs/evidence/**"]
inputs = [
  "A Mu-Silicium checkout carrying a ruyi board package: ruyi.dsc/fdf copied from the same-SoC giulia package with the board identity, the 1224x2912 framebuffer PCDs and the Display_Reserved memory map entry changed.",
  "ABL's scanout reservation: 0xFC400000 + 45 MiB (0x2B00000), from the ruyi live FDT /reserved-memory/splash_region (label cont_splash_region).",
  "Boot image parameters: FD base/size and the shim header, from the same Mu-Silicium device configuration.",
]
configuration = [
  "firmware.config = ruyi; firmware.dsc = Platforms/Xiaomi/ruyiPkg/ruyi.dsc; firmware.fd = Build/ruyiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.",
  "firmware.defines: ENABLE_SECUREBOOT = 1, DEVICE_MODEL = ruyi, MEMORY_PROTECTION = TRUE, SHIP_MODE = FALSE, BUILDID_STRING = ruyi-research.",
  "[[bootimg.dtb_node]] adds /reserved-memory/display_reserved with label 'Display Reserved' and the same 0xFC400000/0x2B00000 range to the firmware DTB only.",
]
procedure = [
  "Build the UEFI firmware from the ruyi Mu-Silicium checkout, then assemble the boot image with the firmware DTB.",
  "Inspect the boot image: the firmware volume, the shim and the appended DTB must carry the display_reserved alias.",
]
findings = [
  "SimpleFbDxe looks the scanout region up by the name 'Display Reserved' and installs no GOP when the name is absent, while ABL only keeps the panel powered for a region labelled 'cont_splash_region'. Both names must be present in the firmware DTB, which is why the alias is a boot-image dtb_node and not a second node in the XNU hardware tree.",
  "Adding the alias to dts/ruyi.dts instead would make the payload tree carry a duplicate reservation and fdtput fails with FDT_ERR_EXISTS.",
  "No ruyi Mu-Silicium checkout is published, so the firmware paths in board.toml are the intended layout and have not been built from this repository.",
  "The ruyiPkg inherited from the same-SoC giulia package carried UniXNU and UniXNUDxe in its FDF but not DarwinBoot, and wired no disk, partition or FAT driver at all. A firmware built from that description boots to the UniXNU menu and then offers no entries, because the in-RAM payload FAT volume is never published. firmware/ruyiPkg-payload-integration.patch adds DarwinBoot, the board's RuyiInitrdDxe, PartitionDxe, DiskIoDxe, EnglishDxe and the FAT driver to both the DSC [Components] and the FDF.",
  "RuyiInitrdDxe is board-local rather than the shared UniXNURamDiskDxe: it is the giulia driver adapted with ruyi's DDR-bank scan rules, so the scan cannot walk past the end of a declared bank into unmapped memory. Either satisfies the integration; scripts/check-firmware.py accepts both.",
]
completion = [
  "The firmware image builds, enters UniXNU, publishes the GOP framebuffer at the ABL scanout address and preserves the documented reservations.",
]
limits = [
  "Firmware integration is not built here: no edk2 toolchain is available in this environment and no ruyi Mu-Silicium repository is published. scripts/check-firmware.py verifies the DSC/FDF wiring, not that the firmware runs.",
  "Vendor firmware blobs for the SoC (clock, TLMM, PMIC) are not inventoried in proprietary-files.txt yet.",
]
next_action = [
  "Publish the ruyi Mu-Silicium board package, then build the firmware and record the FD hash and memory map.",
]
evidence = [
  { kind = "source", reference = "docs/evidence/RUYI-FDT-FACTS.md", result = "ABL scanout reservation quoted from the live ruyi FDT: 0xfc400000 + 0x2b00000." },
  { kind = "source", reference = "board.toml", result = "Firmware inputs and the display_reserved boot-image alias." },
  { kind = "host", reference = "firmware/ruyiPkg-payload-integration.patch", command = "python3 scripts/check-firmware.py --uefi <ruyi Mu-Silicium checkout>", revision = "04b4e558bcded5213c2d802984862dc062f28257", result = "With the patch applied the firmware carries the boot manager, DarwinBoot, the ramdisk Block I/O driver and the partition/disk/FAT stack; every FDF INF is also a DSC component. Verified negative: removing the disk stack makes the check fail with the specific missing modules." },
]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/ruyi.dts", "configs/ruyi_defconfig"]
inputs = [
  "GICv3 distributor at 0x17100000 (64 KiB) and redistributors at 0x17180000 (2 MiB), with redistributor stride 0x40000 - GICv4, four frames per PE. All from the ruyi live FDT.",
  "Generic timer 19,200,000 Hz and virtual timer PPI 27 (INTID 16+11), from the ruyi live FDT /timer.",
  "Eight CPUs with MPIDR affinities 0x0, 0x100 ... 0x700 and capacities 0x400/0x400/0x700 x5/0x766, from the ruyi live FDT /cpus.",
  "PSCI 1.0 over SMC, from the ruyi live FDT /psci.",
]
configuration = [
  "soc/sm8650/dts/sm8650.dtsi exports intc with unixnu,adt-name = intc, reg = <0 0x17100000 0 0x10000>, <0 0x17180000 0 0x200000>, redistributor-stride = <0 0x40000>; dts/ruyi.dts includes it.",
  "cpu0..cpu7 carry unixnu,cluster-type: cpu0/cpu1 E (A520 pair), cpu2..cpu7 P (five A720 plus the X4).",
  "/cpus timebase-frequency = 19200000; /psci compatible arm,psci-1.0, method smc.",
  "Kernel argument cpus=8 exports all eight cores; cpus=1 is the documented fallback for a first bring-up boot.",
]
procedure = [
  "Compile dts/ruyi.dts and generate the ADT; inspect that /cpus has eight cpuN children with the expected reg and cluster-type, that /arm-io/intc carries both GIC ranges and the 0x40000 stride, and that /psci is present.",
  "On the device, record per-CPU entry, the timer interrupt rate and IPI delivery.",
]
findings = [
  "The redistributor stride is the value most likely to be silently wrong on a GICv4 SoC: with 0x20000 every PE after the first gets another PE's frames. XNU reads it from the ADT, so the ADT must carry 0x40000 rather than the GICv3 default.",
  "The vendor tree puts the timebase on /timer, not on /cpus; the UniXNU ADT generator reads it from /cpus, so the board DTS restates the same 19.2 MHz there. Both values come from the same FDT, so this is a placement change, not a new constant.",
  "SM8650's CPU capacities split 2x A520 / 5x A720 / 1x X4, so an 8-core E/P split needs the capacities, not the core count, to classify the clusters.",
]
completion = [
  "Every enabled CPU reaches its entry checkpoint and timer and IPI handling works on each enabled CPU.",
]
limits = [
  "No ruyi device run from this repository. The GIC and timer values are read from the device's own live FDT, but this port has not booted with them.",
  "CPU frequency and idle policy are not ported; no performance controller driver is selected.",
]
next_action = [
  "Boot the payload on ruyi with cpus=1, confirm the timer tick and the console, then repeat with cpus=8 and confirm all eight CPUs enter.",
]
evidence = [
  { kind = "source", reference = "docs/evidence/RUYI-FDT-FACTS.md", result = "GICv3 ranges and 0x40000 stride, /timer 0x124f800, /psci smc, eight CPU affinities and capacities, all quoted from the live ruyi FDT." },
  { kind = "source", reference = "dts/ruyi.dts", result = "Board DTS exporting intc and cpu0..cpu7 with cluster types." },
]

[[area]]
id = "memory"
status = "host-verified"
components = []
paths = ["dts/ruyi.dts", "board.toml"]
inputs = [
  "DRAM layout from the ruyi live FDT /memory, decoded as 16 ranges with 2 address cells and 2 size cells.",
  "The largest contiguous run is 0x8c0000000 .. 0xb00000000 = 9 GiB (3 GiB at 0x8c0000000 plus 6 GiB at 0x980000000, adjacent).",
  "DarwinBoot's contiguous window: payload.adt.owned_memory_size is the loader's request, 256 MiB to 8 GiB in 2 MiB steps.",
]
configuration = [
  "dts/ruyi.dts /memory@8c0000000: reg = <0x8 0xc0000000 0x2 0x40000000>, i.e. base 0x8c0000000, size 0x240000000.",
  "The SoC resources the tree needs come from soc/sm8650/dts/sm8650.dtsi via include_dirs = [\"soc:dts\"]; the board DTS adds only the memory window and the scanout reservation.",
  "board.toml payload.dram_size = 0x240000000, which the payload step requires to equal the DTS memory size exactly.",
  "board.toml payload.adt.owned_memory_size = 0x200000000 (8 GiB, the loader maximum) for the RAM-disk root window.",
]
procedure = [
  "Decode /memory from the live FDT, merge adjacent ranges and confirm the window lies inside a single contiguous run.",
  "Compile the board DTS and generate the ADT with a unique chip ID; check /chosen dram-base, dram-size and darwinboot-memory-size.",
]
findings = [
  "The ruyi DDR is fragmented by Qualcomm carve-outs: 16 ranges, only four contiguous runs of 256 MiB or more. A window chosen by size alone would overlap a hole. The 9 GiB run at 0x8c0000000 is the only one that fits an 8 GiB loader window.",
  "The run ends exactly at 0xb00000000; the next range below it is a separate 29 MiB reservation at 0x8b8100000 with a gap. A 10 GiB window would therefore claim unmapped DDR, which is why the DTS does not use one.",
  "The XNU hardware tree needs exactly one contiguous memory node: the ADT generator rejects anything else, so the board DTS cannot describe the full fragmented map.",
]
completion = [
  "All handoff regions are accounted for and the kernel window lies entirely inside a contiguous run of the device's real DRAM map.",
]
limits = [
  "The DTS describes the kernel-managed window only, not the full DRAM map. Regions outside it are the bootloader's business in this profile.",
  "No SMMU or DMA ownership is described: this profile enables no DMA-capable driver.",
]
next_action = [
  "On the device, confirm the loader lands at 0x8c0000000 and that the kernel's physical memory map matches the window.",
]
evidence = [
  { kind = "source", reference = "docs/evidence/RUYI-FDT-FACTS.md", result = "All 16 /memory ranges, the merged contiguous runs, and the 9 GiB run used as the kernel window." },
  { kind = "host", reference = "dts/ruyi.dts", command = "dtc -I dts -O dtb -o /tmp/ruyi.dtb dts/ruyi.dts", revision = "04b4e558bcded5213c2d802984862dc062f28257", result = "The board DTS compiles cleanly with dtc 1.7.2." },
  { kind = "host", reference = "https://github.com/UniXNU/UniXNU/blob/04b4e558bcded5213c2d802984862dc062f28257/scripts/make-adt.py", command = "python3 scripts/make-adt.py --dtb /tmp/ruyi.dtb --os-profile profiles/os/ios-16.7.16-20H392/profile.toml --board ../UniXNU-ruyi/board.toml --unique-chip-id <seed> --output /tmp/kernel.macho.adt", revision = "04b4e558bcded5213c2d802984862dc062f28257", result = "The ADT generator accepts the tree and emits /chosen with dram-base, dram-size, darwinboot-memory-size and the eight CPU nodes." },
]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["dts/ruyi.dts", "board.toml", "configs/ruyi_defconfig"]
inputs = [
  "UFS host at 0x1d84000 with the five register ranges and SPI 0x109, from the ruyi live FDT /soc/ufshc@1d84000.",
  "UFS PHY at 0x1d80000 (8 KiB), from the ruyi live FDT /soc/ufsphy_mem@1d80000.",
  "Partition geometry from the ruyi GPT - NOT YET READ, so [userdata] is absent from board.toml on purpose.",
]
configuration = [
  "dts/ruyi.dts exports ufshc and ufsphy but both are status = disabled for this profile.",
  "configs/ruyi_defconfig sets CONFIG_XNU_NATIVE_UFS=n: the software-render milestone boots its root filesystem from a RAM disk.",
  "board.toml has no [userdata] table; the key names are present but commented out until the GPT is read.",
]
procedure = [
  "When the UFS root route is ported: read the ruyi GPT, fill [userdata] first_lba/last_lba/lba_bytes, enable the two DTS nodes and the UFS configuration, then record the LUN and GPT evidence.",
]
findings = [
